<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <title>Project — Jumpin</title>
    <meta
      name="description"
      content="Danh sách các event và project cộng đồng mà fan-team Jumpin đã tổ chức."
    />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dist/style.css" />
  </head>

  <body class="flex min-h-screen flex-col bg-ink-900">
    <header class="sticky top-0 z-40 border-b border-ink-800/80 bg-ink-900/90 backdrop-blur">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-5 sm:py-4">
        <a href="index.html" class="flex items-center gap-3" data-brand></a>

        <nav class="hidden items-center gap-10 md:flex" aria-label="Điều hướng chính">
          <a href="index.html" class="nav-link">Home</a>
          <a href="project.html" class="nav-link" aria-current="page">Project</a>
          <a href="member.html" class="nav-link">Member</a>
          <a href="contact.html" class="nav-link">Liên hệ</a>
        </nav>

        <button
          id="menu-btn"
          type="button"
          class="rounded-lg p-2 text-neutral-300 hover:bg-ink-800 md:hidden"
          aria-expanded="false"
          aria-controls="mobile-menu"
          aria-label="Mở menu"
        >
          <svg data-icon-open class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
          <svg data-icon-close class="hidden h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <nav id="mobile-menu" class="hidden border-t border-ink-800 px-4 py-2 md:hidden">
        <a href="index.html" class="block border-b border-ink-800/60 py-3 text-neutral-400 transition hover:text-blush-200 last:border-0">Home</a>
        <a href="project.html" class="block border-b border-ink-800/60 py-3 font-medium text-white last:border-0">Project</a>
        <a href="member.html" class="block border-b border-ink-800/60 py-3 text-neutral-400 transition hover:text-blush-200 last:border-0">Member</a>
        <a href="contact.html" class="block border-b border-ink-800/60 py-3 text-neutral-400 transition hover:text-blush-200 last:border-0">Liên hệ</a>
      </nav>
    </header>

    <main class="flex-1">
      <section class="mx-auto max-w-6xl px-4 pt-12 pb-8 sm:px-5 sm:pt-16 text-center">
        <h1 class="text-3xl font-bold tracking-tight text-balance sm:text-5xl">
          <span class="text-blush-200">Project</span> của team
        </h1>
        <p class="mx-auto mt-4 max-w-2xl text-neutral-400">
          Những event, cuộc thi và hoạt động cộng đồng mà
          <span data-team-name class="text-neutral-200"></span> đã và đang thực hiện.
        </p>
        <div class="rule mx-auto mt-7 w-full max-w-xs sm:mt-8 sm:max-w-md"></div>
      </section>

      <!-- Bộ lọc theo trạng thái -->
      <section class="mx-auto max-w-6xl px-4 sm:px-5">
        <div id="project-filter" class="-mx-4 flex snap-x gap-2 overflow-x-auto px-4 pb-1 sm:mx-0 sm:flex-wrap sm:justify-center sm:overflow-visible sm:px-0">
          <button
            type="button"
            data-filter="all"
            aria-pressed="true"
            class="shrink-0 snap-start rounded-full border border-ink-700 px-4 py-2 text-sm text-neutral-400 transition hover:border-blush-300 hover:text-blush-200 aria-pressed:border-blush-300 aria-pressed:bg-ink-800 aria-pressed:text-blush-200"
          >
            Tất cả
          </button>
          <button
            type="button"
            data-filter="done"
            aria-pressed="false"
            class="shrink-0 snap-start rounded-full border border-ink-700 px-4 py-2 text-sm text-neutral-400 transition hover:border-blush-300 hover:text-blush-200 aria-pressed:border-blush-300 aria-pressed:bg-ink-800 aria-pressed:text-blush-200"
          >
            Đã hoàn thành
          </button>
          <button
            type="button"
            data-filter="ongoing"
            aria-pressed="false"
            class="shrink-0 snap-start rounded-full border border-ink-700 px-4 py-2 text-sm text-neutral-400 transition hover:border-blush-300 hover:text-blush-200 aria-pressed:border-blush-300 aria-pressed:bg-ink-800 aria-pressed:text-blush-200"
          >
            Đang diễn ra
          </button>
          <button
            type="button"
            data-filter="upcoming"
            aria-pressed="false"
            class="shrink-0 snap-start rounded-full border border-ink-700 px-4 py-2 text-sm text-neutral-400 transition hover:border-blush-300 hover:text-blush-200 aria-pressed:border-blush-300 aria-pressed:bg-ink-800 aria-pressed:text-blush-200"
          >
            Sắp tới
          </button>
        </div>

        <div id="project-grid" class="mt-10 grid gap-6 pb-20 sm:grid-cols-2 lg:grid-cols-3"></div>
      </section>
    </main>

    <footer class="border-t border-ink-800 px-4 py-10 sm:px-5">
      <div class="mx-auto flex max-w-6xl flex-col items-center gap-4 text-center">
        <div class="flex items-center gap-3" data-brand></div>
        <div class="flex flex-wrap justify-center gap-1" data-socials></div>
        <p class="text-xs text-neutral-500" data-footer-note></p>
        <p class="text-xs text-neutral-600">
          © <span data-year></span> <span data-team-name></span>
        </p>
      </div>
    </footer>

    <script src="assets/data.js"></script>
    <script src="assets/main.js"></script>
  </body>
</html>
